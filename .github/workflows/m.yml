name: build-gpu-chams

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'code/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装基础依赖（缺什么就跳过，不卡流程）
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            git curl zip unzip bc bison flex libssl-dev libelf-dev \
            python3 rsync cpio kmod || true
          echo "=== 工具版本 ==="
          clang --version 2>/dev/null | head -2 || echo "no clang"
          ld.lld --version 2>/dev/null | head -1 || echo "no lld"
          nproc

      - name: 安装 repo 工具
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo || \
          wget -qO ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/repo --version || true
          git config --global user.name "ci"
          git config --global user.email "ci@ci"

      - name: 同步 GKI 内核源码 (android15-6.6)
        run: |
          export PATH=$HOME/bin:$PATH
          mkdir -p ~/gki && cd ~/gki
          repo init -u https://android.googlesource.com/kernel/manifest \
                    -b common-android15-6.6 --depth 1
          repo sync -j4 --no-tags --optimize 2>/dev/null || repo sync -j2
          echo "=== 源码就位 ==="
          cd ~/gki/common
          head -5 Makefile
          ls arch/arm64/configs/ | head -20
          git log --oneline -1 || true

      - name: 配置 + 编译内核（生成 Module.symvers）
        run: |
          cd ~/gki/common
          export ARCH=arm64
          export CC=clang
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          if [ -f arch/arm64/configs/gki_defconfig ]; then
            make -j$(nproc) O=out gki_defconfig
          else
            make -j$(nproc) O=out defconfig
          fi
          # 必须完整编一次，否则没有 Module.symvers（MODVERSIONS 要用）
          make -j$(nproc) O=out CC=clang LLVM=1 \
               LD=ld.lld AR=llvm-ar NM=llvm-nm \
               OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               HOSTCC=clang HOSTCXX=clang++ 2>&1 | tail -40
          echo "=== 内核版本 ==="
          make -s O=out kernelrelease 2>/dev/null || cat out/include/config/kernel.release 2>/dev/null
          echo "=== Module.symvers ==="
          ls -l out/Module.symvers || echo "没有 Module.symvers"

      - name: 编译 gpu_chams
        run: |
          cd $GITHUB_WORKSPACE/code
          make -C $HOME/gki/common O=$HOME/gki/common/out M=$PWD \
               ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
               modules 2>&1 | tail -40
          echo "=== 产物 ==="
          ls -l *.ko || echo "没编出 ko"

      - name: 收集产物
        if: always()
        run: |
          mkdir -p /tmp/out
          find $GITHUB_WORKSPACE -name '*.ko' -exec cp -v {} /tmp/out/ \; || true
          cp -v $HOME/gki/common/out/Module.symvers /tmp/out/ 2>/dev/null || true
          ls -la /tmp/out

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu_chams-ko
          path: /tmp/out/
          if-no-files-found: warn
          retention-days: 14
