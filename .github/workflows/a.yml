name: build-gpu-chams

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            git curl zip unzip bc bison flex libssl-dev libelf-dev \
            python3 rsync cpio kmod \
            clang lld llvm dwarves gcc-aarch64-linux-gnu || true
          export PATH=/usr/local/bin:$PATH
          if ! command -v ld.lld >/dev/null 2>&1; then
            for c in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              [ -e "$c" ] && sudo ln -sf "$c" /usr/local/bin/ld.lld && break
            done
          fi
          which ld.lld && ld.lld --version | head -1 || echo "no ld.lld"
          which clang  && clang --version | head -2  || echo "no clang"
          which pahole || echo "no pahole"

      - name: 打印仓库结构（诊断用）
        run: |
          echo "=== 根目录 ==="
          ls -la
          echo "=== code 是什么 ==="
          if [ -d code ]; then echo "code 是目录"; ls -la code;
          elif [ -f code ]; then echo "code 是文件（要删掉）"; file code || true;
          else echo "code 不存在（正常）"; fi
          echo "=== 找源码 ==="
          find . -maxdepth 2 -name 'gpu_chams.c' -not -path './.git/*'

      - name: 安装 repo 工具
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo || \
          wget -qO ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name ci
          git config --global user.email ci@ci

      - name: 同步 GKI 内核源码
        run: |
          export PATH=$HOME/bin:$PATH
          mkdir -p ~/gki && cd ~/gki
          repo init -u https://android.googlesource.com/kernel/manifest \
                    -b common-android15-6.6 --depth 1
          repo sync -j4 --no-tags --optimize 2>/dev/null || repo sync -j2
          cd ~/gki/common && head -5 Makefile

      - name: 生成 defconfig
        run: |
          cd ~/gki/common
          export PATH=/usr/local/bin:$PATH ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          if [ -f arch/arm64/configs/gki_defconfig ]; then
            make -j$(nproc) O=out CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld gki_defconfig
          else
            make -j$(nproc) O=out CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld defconfig
          fi
          grep -E 'CONFIG_LOCALVERSION=|CONFIG_MODVERSIONS|CONFIG_MODULES=' out/.config | head

      - name: 编译内核（生成 Module.symvers）
        run: |
          cd ~/gki/common
          export PATH=/usr/local/bin:$PATH ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          if ! command -v pahole >/dev/null 2>&1; then
            ./scripts/config --file out/.config -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES || true
          fi
          make -j$(nproc) O=out CC=clang LLVM=1 \
               LD=ld.lld AR=llvm-ar NM=llvm-nm \
               OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               HOSTCC=clang HOSTCXX=clang++ 2>&1 | tail -40
          make -s O=out kernelrelease 2>/dev/null || cat out/include/config/kernel.release
          ls -l out/Module.symvers || echo "没有 Module.symvers"

      - name: 编译 gpu_chams（从根目录，不碰 code）
        run: |
          SRC="$GITHUB_WORKSPACE"
          if [ -f "$GITHUB_WORKSPACE/code/gpu_chams.c" ]; then
            SRC="$GITHUB_WORKSPACE/code"
          fi
          echo "源码目录: $SRC"
          ls -la "$SRC"
          cd "$SRC"
          export PATH=/usr/local/bin:$PATH
          make -C $HOME/gki/common O=$HOME/gki/common/out M=$PWD \
               ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
               modules 2>&1 | tail -40
          echo "=== 产物 ==="
          ls -l *.ko || echo "没编出 ko"

      - name: 收集产物
        if: always()
        run: |
          mkdir -p /tmp/out
          find $GITHUB_WORKSPACE -name '*.ko' -not -path '*/.git/*' -exec cp -v {} /tmp/out/ \; || true
          cp -v $HOME/gki/common/out/Module.symvers /tmp/out/ 2>/dev/null || true
          cp -v $HOME/gki/common/out/include/config/kernel.release /tmp/out/ 2>/dev/null || true
          ls -la /tmp/out

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu_chams-ko
          path: /tmp/out/
          if-no-files-found: warn
          retention-days: 14
