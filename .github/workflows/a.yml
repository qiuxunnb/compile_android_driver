name: build-gpu-chams

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'code/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖（这次补上 lld / llvm / aarch64-gcc / dwarves）
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            git curl zip unzip bc bison flex libssl-dev libelf-dev \
            python3 rsync cpio kmod \
            clang lld llvm dwarves gcc-aarch64-linux-gnu || true

          echo "=== 保险 1：确保 ld.lld 能直接调用 ==="
          if ! command -v ld.lld >/dev/null 2>&1; then
            for c in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -e "$c" ]; then
                sudo ln -sf "$c" /usr/local/bin/ld.lld
                echo "软链 $c -> /usr/local/bin/ld.lld"
                break
              fi
            done
          fi

          echo "=== 保险 2：确保 clang 能调用 ==="
          if ! command -v clang >/dev/null 2>&1; then
            for c in /usr/lib/llvm-*/bin/clang; do
              if [ -e "$c" ]; then
                sudo ln -sf "$c" /usr/local/bin/clang
                sudo ln -sf "${c}++" /usr/local/bin/clang++ 2>/dev/null || true
                break
              fi
            done
          fi

          echo "=== 验证 ==="
          export PATH=/usr/local/bin:$PATH
          which ld.lld    && ld.lld --version | head -1 || echo "!! 没有 ld.lld"
          which clang     && clang --version | head -2  || echo "!! 没有 clang"
          which aarch64-linux-gnu-gcc || echo "(没有 aarch64 gcc，不影响 LLVM 构建)"
          which pahole    || echo "(没有 pahole，后面关掉 BTF)"

      - name: 安装 repo 工具
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo || \
          wget -qO ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/repo --version || true
          git config --global user.name "ci"
          git config --global user.email "ci@ci"

      - name: 同步 GKI 内核源码 (android15-6.6)
        run: |
          export PATH=$HOME/bin:$PATH
          mkdir -p ~/gki && cd ~/gki
          repo init -u https://android.googlesource.com/kernel/manifest \
                    -b common-android15-6.6 --depth 1
          repo sync -j4 --no-tags --optimize 2>/dev/null || repo sync -j2
          echo "=== 源码就位 ==="
          cd ~/gki/common
          head -5 Makefile
          ls arch/arm64/configs/ | head -20
          git log --oneline -1 || true

      - name: 生成 defconfig（用 GNU ld，彻底绕开 ld.lld 依赖）
        run: |
          cd ~/gki/common
          export PATH=/usr/local/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          if [ -f arch/arm64/configs/gki_defconfig ]; then
            make -j$(nproc) O=out CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld gki_defconfig
          else
            make -j$(nproc) O=out CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld defconfig
          fi
          echo "=== 关键配置 ==="
          grep -E 'CONFIG_LOCALVERSION=|CONFIG_MODVERSIONS|CONFIG_MODULES=' out/.config | head

      - name: 编译内核（生成 Module.symvers）
        run: |
          cd ~/gki/common
          export PATH=/usr/local/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # 没有 pahole 就关掉 BTF，少一个坑
          if ! command -v pahole >/dev/null 2>&1; then
            ./scripts/config --file out/.config -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES || true
          fi
          make -j$(nproc) O=out CC=clang LLVM=1 \
               LD=ld.lld AR=llvm-ar NM=llvm-nm \
               OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               HOSTCC=clang HOSTCXX=clang++ 2>&1 | tail -50
          echo "=== 内核版本 ==="
          make -s O=out kernelrelease 2>/dev/null || cat out/include/config/kernel.release 2>/dev/null
          echo "=== Module.symvers ==="
          ls -l out/Module.symvers || echo "!! 没有 Module.symvers"

      - name: 编译 gpu_chams
        run: |
          cd $GITHUB_WORKSPACE/code
          export PATH=/usr/local/bin:$PATH
          make -C $HOME/gki/common O=$HOME/gki/common/out M=$PWD \
               ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
               modules 2>&1 | tail -40
          echo "=== 产物 ==="
          ls -l *.ko || echo "!! 没编出 ko"

      - name: 收集产物
        if: always()
        run: |
          mkdir -p /tmp/out
          find $GITHUB_WORKSPACE -name '*.ko' -exec cp -v {} /tmp/out/ \; || true
          cp -v $HOME/gki/common/out/Module.symvers /tmp/out/ 2>/dev/null || true
          echo "=== 内核 release（用于对比 vermagic）==="
          cat $HOME/gki/common/out/include/config/kernel.release 2>/dev/null || true
          ls -la /tmp/out

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu_chams-ko
          path: /tmp/out/
          if-no-files-found: warn
          retention-days: 14
